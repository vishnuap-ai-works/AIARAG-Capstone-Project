[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-pipeline"
version = "0.1.0"
description = "Production RAG Pipeline"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "openai>=3.3.0",
    "langchain==1.3.18",
    "langchain-community<0.4.0",
    "langchain-openai>=1.7.0",
    "langchain-ollama>=1.1.0",
    "langchain-huggingface>=1.2.3",
    "ragas>=0.2.14,<0.3.0",
    "datasets>=5.1.0",
    "chromadb==1.5.9",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "pydantic-settings==2.15.0",
    "python-docx==1.2.0",
    "aiohttp==3.14.3",
    "requests==2.34.2",
    "pytest==9.1.1",
    "ollama==0.6.2",
    "qdrant-client==1.19.1",
    "pinecone-client==6.0.0",
    "sentence-transformers==6.0.1",
    "cohere==7.1.1",
    "huggingface_hub==1.31.0",
    "fastembed==0.8.0",
    "presidio-analyzer==2.2.364",
    "presidio-anonymizer==2.2.364",
    "spacy==3.8.16",
    "tiktoken==0.8.0",
    "llmlingua>=0.2.2",
]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
